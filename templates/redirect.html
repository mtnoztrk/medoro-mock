<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Processing payment…</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f2f4f8; margin: 0; color: #1c2333; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 36px 44px; text-align: center; }
        .spinner { width: 36px; height: 36px; margin: 0 auto 16px; border: 4px solid #e4e9f2; border-top-color: #2456d6; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 18px; margin: 0 0 6px; }
        p { color: #6b7385; font-size: 14px; margin: 0; }
    </style>
</head>
<body>
<div class="card">
    <div class="spinner"></div>
    <h1>Processing payment…</h1>
    <p>Scenario: {{.ScenarioLabel}}</p>
    <p>Sending the callback and redirecting you back.</p>
    <form id="cb" method="post" action="{{.CallbackURL}}">
        <input type="hidden" name="DATA" value="{{.Data}}">
        <input type="hidden" name="KEY" value="{{.Key}}">
        <input type="hidden" name="SIGNATURE" value="{{.Signature}}">
    </form>
</div>
<script>
    setTimeout(function () { document.getElementById('cb').submit(); }, {{.DelayMs}});
</script>
</body>
</html>
